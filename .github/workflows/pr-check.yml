name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Determinism lint (no Math.random outside rng.ts)
        run: pnpm lint:rng
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Legacy app still ships
        run: test -s dist/legacy/index.html
